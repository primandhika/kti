<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><title>Kluster dan deret konsonan</title><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="#111"/></marker><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#777"/></pattern></defs><text x="700.0" y="65" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="38" font-weight="bold" font-style="normal" fill="#111">Membedakan Kluster dan Deret Konsonan</text>
<line x1="90" y1="90" x2="1310" y2="90" stroke="#111" stroke-width="2"/>
<rect x="95" y="150" width="560" height="470" rx="8" fill="#eee" stroke="#111" stroke-width="3"/>
<text x="375.0" y="197" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="29" font-weight="bold" font-style="normal" fill="#111">KLUSTER KONSONAN</text>
<text x="375.0" y="241" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="23" font-weight="normal" font-style="normal" fill="#111">dua konsonan dalam satu silabel</text>
<text x="375.0" y="279" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="23" font-weight="normal" font-style="normal" fill="#111">struktur: K K V</text>
<text x="375.0" y="317" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="23" font-weight="normal" font-style="normal" fill="#111">contoh: /tra/ pada tra-di-si</text>
<text x="375" y="420" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="42" font-weight="bold" font-style="normal" fill="#111">t   r   a</text>
<path d="M260 455 Q375 525 490 455" fill="none" stroke="#111" stroke-width="4"/>
<text x="375" y="560" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="25" font-weight="normal" font-style="normal" fill="#111">satu silabel (σ)</text>
<rect x="745" y="150" width="560" height="470" rx="8" fill="#fff" stroke="#111" stroke-width="3"/>
<text x="1025.0" y="197" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="29" font-weight="bold" font-style="normal" fill="#111">DERET KONSONAN</text>
<text x="1025.0" y="241" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="23" font-weight="normal" font-style="normal" fill="#111">konsonan bersebelahan lintas silabel</text>
<text x="1025.0" y="279" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="23" font-weight="normal" font-style="normal" fill="#111">struktur: ...K . K...</text>
<text x="1025.0" y="317" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="23" font-weight="normal" font-style="normal" fill="#111">contoh: /k.t/ pada bak-ti</text>
<text x="1025" y="420" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="42" font-weight="bold" font-style="normal" fill="#111">k   .   t</text>
<line x1="1025" y1="450" x2="1025" y2="535" stroke="#111" stroke-width="4" stroke-dasharray="7 7"/>
<text x="1025" y="570" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="25" font-weight="normal" font-style="normal" fill="#111">dua silabel</text>
<text x="700" y="735" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="27" font-weight="normal" font-style="italic" fill="#111">Letak batas silabel menentukan analisis.</text></svg>
