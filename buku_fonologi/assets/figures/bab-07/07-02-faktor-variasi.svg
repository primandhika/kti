<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><title>Faktor variasi pelafalan</title><rect width="100%" height="100%" fill="#fff"/><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L10,4 z" fill="#111"/></marker><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#777"/></pattern></defs><text x="700.0" y="65" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="38" font-weight="bold" font-style="normal" fill="#111">Faktor yang Memengaruhi Variasi Pelafalan</text>
<line x1="90" y1="90" x2="1310" y2="90" stroke="#111" stroke-width="2"/>
<rect x="500" y="130" width="400" height="115" rx="8" fill="#eee" stroke="#111" stroke-width="3"/>
<text x="700.0" y="177" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="29" font-weight="bold" font-style="normal" fill="#111">VARIASI PELAFALAN</text>
<text x="700.0" y="221" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="23" font-weight="normal" font-style="normal" fill="#111">bentuk yang diamati</text>
<line x1="700" y1="245" x2="205" y2="350" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="370" width="300" height="205" rx="8" fill="#fff" stroke="#111" stroke-width="3"/>
<text x="205.0" y="417" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="25" font-weight="bold" font-style="normal" fill="#111">WILAYAH</text>
<text x="205.0" y="461" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="21" font-weight="normal" font-style="normal" fill="#111">kontak bahasa</text>
<text x="205.0" y="499" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="21" font-weight="normal" font-style="normal" fill="#111">komunitas tutur</text>
<line x1="700" y1="245" x2="535" y2="350" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="385" y="370" width="300" height="205" rx="8" fill="#fff" stroke="#111" stroke-width="3"/>
<text x="535.0" y="417" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="25" font-weight="bold" font-style="normal" fill="#111">SOSIAL</text>
<text x="535.0" y="461" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="21" font-weight="normal" font-style="normal" fill="#111">usia • pendidikan</text>
<text x="535.0" y="499" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="21" font-weight="normal" font-style="normal" fill="#111">jejaring penutur</text>
<line x1="700" y1="245" x2="865" y2="350" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="715" y="370" width="300" height="205" rx="8" fill="#fff" stroke="#111" stroke-width="3"/>
<text x="865.0" y="417" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="25" font-weight="bold" font-style="normal" fill="#111">SITUASI</text>
<text x="865.0" y="461" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="21" font-weight="normal" font-style="normal" fill="#111">formal • santai</text>
<text x="865.0" y="499" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="21" font-weight="normal" font-style="normal" fill="#111">mitra tutur</text>
<line x1="700" y1="245" x2="1195" y2="350" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1045" y="370" width="300" height="205" rx="8" fill="#fff" stroke="#111" stroke-width="3"/>
<text x="1195.0" y="417" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="25" font-weight="bold" font-style="normal" fill="#111">INDIVIDU</text>
<text x="1195.0" y="461" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="21" font-weight="normal" font-style="normal" fill="#111">kebiasaan</text>
<text x="1195.0" y="499" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="21" font-weight="normal" font-style="normal" fill="#111">gaya berbicara</text>
<text x="700" y="730" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="24" font-weight="normal" font-style="italic" fill="#111">Variasi perlu dideskripsikan dari data, bukan diasumsikan dari identitas penutur.</text></svg>
