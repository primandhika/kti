<text x="1050.0" y="246" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="23" font-weight="normal" font-style="normal" fill="#111">satuan dalam sistem bunyi</text>
<text x="1050.0" y="284" text-anchor="middle" font-family="Noto Serif, DejaVu Serif, serif" font-size="23" font-weight="normal" font-style="normal" fill="#111">ditulis /.../</text>
